name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.1). Leave blank to auto-tag v1.0.<run_number>.'
        required: false
        default: ''

jobs:
  build-android-apk:
    name: Build & Release NoorCut Studio APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run unit tests and TypeScript check
        run: |
          npx --yes tsx --test src/utils/canvasMath.test.ts src/utils/recentExports.test.ts src/utils/keyboardShortcuts.test.ts src/utils/batchQueue.test.ts src/utils/imageLimits.test.ts src/legal/legalContent.test.ts src/i18n/translations.test.ts
          npm run lint

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx --yes cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode optional release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
            echo "Custom release keystore configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; using fallback debug signing for shareable APK."
          fi

      - name: Build Release & Debug APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare shareable APK artifacts
        run: |
          mkdir -p apk-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/NoorCut-Studio.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/NoorCut-Studio.apk
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/NoorCut-Studio-debug.apk
          (cd apk-output && sha256sum NoorCut-Studio.apk > NoorCut-Studio.apk.sha256)

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoorCut-Studio-APK
          path: |
            apk-output/NoorCut-Studio.apk
            apk-output/NoorCut-Studio-debug.apk
            apk-output/NoorCut-Studio.apk.sha256
          retention-days: 30

      - name: Determine Release Tag
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish Shareable GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NoorCut Studio ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## NoorCut Studio Android APK (${{ steps.meta.outputs.tag }})

            - **Direct Shareable Download:** [`NoorCut-Studio.apk`](https://github.com/${{ github.repository }}/releases/latest/download/NoorCut-Studio.apk)
            - **SHA-256 Checksum:** Included in `NoorCut-Studio.apk.sha256`
            - **Privacy Policy & Terms:** Available on the repository GitHub Pages site at `/privacy-terms.html`
          files: |
            apk-output/NoorCut-Studio.apk
            apk-output/NoorCut-Studio-debug.apk
            apk-output/NoorCut-Studio.apk.sha256
